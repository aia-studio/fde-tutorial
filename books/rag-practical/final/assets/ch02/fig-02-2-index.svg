<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="30" font-size="15" fill="#0C447C" text-anchor="middle">索引结构与一次增量更新</text>
  <rect x="30" y="55" width="120" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="90" y="85" font-size="13" fill="#0C447C" text-anchor="middle">tickets.csv</text>
  <rect x="190" y="55" width="120" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="250" y="78" font-size="13" fill="#0C447C" text-anchor="middle">切分 + 嵌入</text>
  <text x="250" y="96" font-size="11" fill="#3C4C5C" text-anchor="middle">每块带元数据</text>
  <rect x="350" y="45" width="150" height="70" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="425" y="68" font-size="13" fill="#245024" text-anchor="middle">chunks 表</text>
  <text x="425" y="86" font-size="11" fill="#2C4C2C" text-anchor="middle">chunk_id 主键</text>
  <text x="425" y="102" font-size="11" fill="#2C4C2C" text-anchor="middle">vector 为 BLOB</text>
  <rect x="540" y="45" width="110" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="595" y="68" font-size="13" fill="#0C447C" text-anchor="middle">meta 表</text>
  <text x="595" y="88" font-size="11" fill="#3C4C5C" text-anchor="middle">维度 / 构建信息</text>
  <line x1="150" y1="80" x2="186" y2="80" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#b)"/>
  <line x1="310" y1="80" x2="346" y2="80" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#b)"/>
  <line x1="500" y1="80" x2="536" y2="80" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#b)"/>
  <rect x="190" y="165" width="310" height="95" rx="6" fill="#FDF3E7" stroke="#B57A2A" stroke-width="0.8"/>
  <text x="210" y="190" font-size="13" fill="#7A4A12">更新一条工单：先删后插，包在一个事务里</text>
  <text x="210" y="214" font-size="12" fill="#7A4A12">1. DELETE FROM chunks WHERE ticket_no = ?</text>
  <text x="210" y="236" font-size="12" fill="#7A4A12">2. 按新内容重建这条工单的块并写入</text>
  <text x="210" y="254" font-size="11" fill="#7A4A12">别的工单一个字节都不动，块总数不变</text>
  <line x1="425" y1="120" x2="425" y2="160" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#b)"/>
  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7B"/></marker></defs>
</svg>
