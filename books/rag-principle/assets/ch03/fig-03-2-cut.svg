<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250">
  <rect width="680" height="250" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="28" font-size="13" fill="#6B6252" text-anchor="middle">边界切断：切点落在条件与结论之间</text>
  <rect x="40" y="50" width="600" height="46" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="78" font-size="12" fill="#3A3428" text-anchor="middle">若客户在三十天内提出，经审核后可全额退款</text>
  <line x1="300" y1="42" x2="300" y2="104" stroke="#A33A3A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="300" y="38" font-size="10" fill="#A33A3A" text-anchor="middle">切点</text>
  <rect x="60" y="126" width="230" height="46" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="175" y="146" font-size="12" fill="#245024" text-anchor="middle">块 A：条件半句</text>
  <text x="175" y="162" font-size="10" fill="#3B7A3B" text-anchor="middle">「若客户在三十天内提出」</text>
  <rect x="390" y="126" width="230" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="505" y="146" font-size="12" fill="#0C447C" text-anchor="middle">块 B：结论半句</text>
  <text x="505" y="162" font-size="10" fill="#185FA5" text-anchor="middle">「经审核后可全额退款」</text>
  <line x1="292" y1="149" x2="386" y2="149" stroke="#A33A3A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="143" font-size="10" fill="#A33A3A" text-anchor="middle">断开</text>
  <text x="340" y="200" font-size="11" fill="#7A3E0A" text-anchor="middle">检索只带回 A，模型用常识补上条件，结论就超出证据</text>
  <text x="340" y="224" font-size="11" fill="#6B6252" text-anchor="middle">可观测信号：块首出现「但是」「因此」「该」，块尾停在从句中间</text>
</svg>
