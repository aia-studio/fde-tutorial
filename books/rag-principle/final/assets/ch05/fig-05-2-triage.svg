<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="26" font-size="13" fill="#6B6252" text-anchor="middle">定位流程：先确认证据在不在，再谈模型</text>
  <rect x="260" y="48" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="72" font-size="12" fill="#3A3428" text-anchor="middle">答案错误</text>
  <rect x="250" y="112" width="180" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="136" font-size="11" fill="#0C447C" text-anchor="middle">语料里有答案吗</text>
  <rect x="250" y="176" width="180" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="200" font-size="11" fill="#0C447C" text-anchor="middle">候选里有正确块吗</text>
  <rect x="250" y="240" width="180" height="38" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="340" y="264" font-size="11" fill="#7A3E0A" text-anchor="middle">证据支持结论吗</text>
  <line x1="340" y1="88" x2="340" y2="108" stroke="#6B6252" stroke-width="1.2" marker-end="url(#g)"/>
  <line x1="340" y1="152" x2="340" y2="172" stroke="#6B6252" stroke-width="1.2" marker-end="url(#g)"/>
  <line x1="340" y1="216" x2="340" y2="236" stroke="#6B6252" stroke-width="1.2" marker-end="url(#g)"/>
  <defs><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <line x1="430" y1="131" x2="486" y2="131" stroke="#A33A3A" stroke-width="1.2" marker-end="url(#h)"/>
  <line x1="430" y1="195" x2="486" y2="195" stroke="#A33A3A" stroke-width="1.2" marker-end="url(#h)"/>
  <line x1="430" y1="259" x2="486" y2="259" stroke="#A5611B" stroke-width="1.2" marker-end="url(#i)"/>
  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#A33A3A"/></marker>
    <marker id="i" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#A5611B"/></marker>
  </defs>
  <text x="490" y="128" font-size="10" fill="#A33A3A">否：补语料或换数据源</text>
  <text x="490" y="192" font-size="10" fill="#A33A3A">否：修切分、召回与排序</text>
  <text x="490" y="256" font-size="10" fill="#A5611B">否：修约束，或直接拒答</text>
