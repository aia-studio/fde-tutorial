<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="30" font-size="15" fill="#0C447C" text-anchor="middle">引用链路：从命中块到可核对的一句话</text>
  <rect x="25" y="55" width="125" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="87" y="80" font-size="13" fill="#0C447C" text-anchor="middle">命中块</text>
  <text x="87" y="100" font-size="11" fill="#3C4C5C" text-anchor="middle">块文本 + 工单号</text>
  <rect x="180" y="55" width="125" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="242" y="80" font-size="13" fill="#0C447C" text-anchor="middle">切句</text>
  <text x="242" y="100" font-size="11" fill="#3C4C5C" text-anchor="middle">按句末标点</text>
  <rect x="335" y="55" width="125" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="397" y="80" font-size="13" fill="#0C447C" text-anchor="middle">只在处理结论里选</text>
  <text x="397" y="100" font-size="11" fill="#3C4C5C" text-anchor="middle">重合词最多的一句</text>
  <rect x="490" y="55" width="160" height="60" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="570" y="80" font-size="13" fill="#245024" text-anchor="middle">引文 + 回查</text>
  <text x="570" y="100" font-size="11" fill="#2C4C2C" text-anchor="middle">quote in source 为真</text>
  <line x1="150" y1="85" x2="176" y2="85" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="305" y1="85" x2="331" y2="85" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="460" y1="85" x2="486" y2="85" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#d)"/>
  <rect x="180" y="150" width="320" height="105" rx="6" fill="#FDF3E7" stroke="#B57A2A" stroke-width="0.8"/>
  <text x="200" y="174" font-size="13" fill="#7A4A12">回查失败时不许兜底放行</text>
  <text x="200" y="198" font-size="12" fill="#7A4A12">模型改写、补字、换同义词都会让引文对不上</text>
  <text x="200" y="220" font-size="12" fill="#7A4A12">对不上就降级为抽取式，或者拒答</text>
  <text x="200" y="242" font-size="12" fill="#7A4A12">这条规则是整条链路的最后一道闸</text>
  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7B"/></marker></defs>
</svg>
