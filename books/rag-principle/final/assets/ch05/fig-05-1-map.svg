<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230">
  <rect width="680" height="230" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="28" font-size="13" fill="#6B6252" text-anchor="middle">一次错误答案只有两种归属：证据没进来，或者模型越界</text>
  <rect x="30" y="66" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="85" y="88" font-size="12" fill="#3A3428" text-anchor="middle">问题</text>
  <text x="85" y="105" font-size="10" fill="#6B6252" text-anchor="middle">用户意图</text>
  <rect x="180" y="66" width="120" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="240" y="88" font-size="12" fill="#0C447C" text-anchor="middle">检索</text>
  <text x="240" y="105" font-size="10" fill="#185FA5" text-anchor="middle">把证据带进来</text>
  <rect x="340" y="66" width="120" height="52" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="400" y="88" font-size="12" fill="#245024" text-anchor="middle">生成</text>
  <text x="400" y="105" font-size="10" fill="#3B7A3B" text-anchor="middle">基于证据表达</text>
  <rect x="500" y="66" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="560" y="88" font-size="12" fill="#3A3428" text-anchor="middle">答案</text>
  <text x="560" y="105" font-size="10" fill="#6B6252" text-anchor="middle">对或错</text>
  <line x1="142" y1="92" x2="176" y2="92" stroke="#6B6252" stroke-width="1.2" marker-end="url(#f)"/>
  <line x1="302" y1="92" x2="336" y2="92" stroke="#6B6252" stroke-width="1.2" marker-end="url(#f)"/>
  <line x1="462" y1="92" x2="496" y2="92" stroke="#6B6252" stroke-width="1.2" marker-end="url(#f)"/>
  <defs><marker id="f" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <rect x="150" y="146" width="200" height="42" rx="6" fill="#FBEAEA" stroke="#A33A3A" stroke-width="0.8"/>
  <text x="250" y="164" font-size="11" fill="#7A1F1F" text-anchor="middle">检索缺失</text>
  <text x="250" y="180" font-size="10" fill="#A33A3A" text-anchor="middle">正确证据没进候选</text>
  <rect x="380" y="146" width="200" height="42" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="480" y="164" font-size="11" fill="#7A3E0A" text-anchor="middle">生成越界</text>
  <text x="480" y="180" font-size="10" fill="#A5611B" text-anchor="middle">证据在场，结论超出证据</text>
  <line x1="240" y1="120" x2="240" y2="142" stroke="#A33A3A" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="400" y1="120" x2="460" y2="142" stroke="#A5611B" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="340" y="214" font-size="11" fill="#6B6252" text-anchor="middle">两种错误的修法不同，判断顺序决定修复成本</text>
</svg>
