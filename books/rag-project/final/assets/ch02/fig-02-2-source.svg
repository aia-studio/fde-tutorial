<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Source Han Sans SC, Noto Sans SC, sans-serif">
  <rect width="680" height="320" rx="8" fill="#F7F4EF" stroke="#D9CFC0" stroke-width="0.8"/>
  <text x="340" y="28" font-size="13" fill="#6B5B45" text-anchor="middle">盘点决定接什么：授权缺口不进第一版语料</text>

  <rect x="30" y="50" width="140" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="100" y="70" font-size="12" fill="#0C447C" text-anchor="middle">工单主表</text>
  <text x="100" y="85" font-size="10" fill="#4A6B8A" text-anchor="middle">PostgreSQL</text>

  <rect x="190" y="50" width="140" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="260" y="70" font-size="12" fill="#0C447C" text-anchor="middle">工单回复</text>
  <text x="260" y="85" font-size="10" fill="#4A6B8A" text-anchor="middle">PostgreSQL</text>

  <rect x="350" y="50" width="140" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="420" y="70" font-size="12" fill="#0C447C" text-anchor="middle">产品手册</text>
  <text x="420" y="85" font-size="10" fill="#4A6B8A" text-anchor="middle">共享网盘</text>

  <rect x="510" y="50" width="140" height="44" rx="6" fill="#FDF1EC" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="580" y="70" font-size="12" fill="#8A3D06" text-anchor="middle">历史邮件</text>
  <text x="580" y="85" font-size="10" fill="#8A3D06" text-anchor="middle">未授权 · 暂缓</text>

  <line x1="100" y1="94" x2="100" y2="128" stroke="#B9AC98" stroke-width="1.2"/>
  <line x1="260" y1="94" x2="260" y2="128" stroke="#B9AC98" stroke-width="1.2"/>
  <line x1="420" y1="94" x2="420" y2="128" stroke="#B9AC98" stroke-width="1.2"/>

  <rect x="30" y="128" width="620" height="46" rx="6" fill="#FFFFFF" stroke="#C9BDA9" stroke-width="1"/>
  <text x="340" y="147" font-size="12" fill="#4A4137" text-anchor="middle">盘点四件事：责任方 · 访问方式 · 敏感字段 · 授权状态</text>
  <text x="340" y="164" font-size="10" fill="#8A7C68" text-anchor="middle">清单没填完之前，不在会上承诺对接时间</text>

  <line x1="190" y1="174" x2="190" y2="204" stroke="#B9AC98" stroke-width="1.2"/>
  <line x1="490" y1="174" x2="490" y2="204" stroke="#B9AC98" stroke-width="1.2"/>

  <rect x="30" y="204" width="320" height="48" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="190" y="224" font-size="12" fill="#0C447C" text-anchor="middle">只读从库接入（db.py）</text>
  <text x="190" y="241" font-size="10" fill="#4A6B8A" text-anchor="middle">URI mode=ro 加 query_only，双保险</text>

  <rect x="370" y="204" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#C9BDA9" stroke-width="1"/>
  <text x="510" y="224" font-size="12" fill="#4A4137" text-anchor="middle">人工导出（mapping.py）</text>
  <text x="510" y="241" font-size="10" fill="#8A7C68" text-anchor="middle">先定映射表，再谈批量</text>

  <text x="340" y="288" font-size="11" fill="#8A3D06" text-anchor="middle">暂缓项写进风险登记：授权不到，语料就少一块，验收范围要同步改</text>
  <text x="340" y="306" font-size="10" fill="#8A7C68" text-anchor="middle">图中所列为本书演示数据</text>
</svg>
