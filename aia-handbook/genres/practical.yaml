# genre: practical · 可量化字段
# 这些值会被 book.yaml 的同名字段覆盖。
# 标 [初值] 的是经验估计，第一波完成后由 style-fingerprint 校准覆盖。
# 人读的解释在 practical.md，本文件只放机器要读的。

genre: practical
label: 技术实战手册
extends: _core

# ── 排他维度：混合时只比这两项，不一致即报错 ──
exclusive:
  skeleton: practical-9        # 骨架标识；混合时用这个值判冲突
  # null = 不约束 spine（三档都行）；"none" = 强制各章独立
  spine_constraint: null

# ── 可叠加维度：混合时取并集 / 取严 ──
stackable:
  annotations: [注意, 提示, 陷阱, 最佳实践, 代价, 待确认, 版本, 排查]
  exercise_form: [动手任务]
  code_required: true

# ── 骨架：闸门按这个逐段核对 ──
skeleton:
  - id: header
    detect: keys
    keys: [本章解决, 前置, 阅读, 动手, 交付物]
    required: true
  - id: mindmap
    detect: heading
    aliases: [章首导图, 本章结构]
    required: true
  - id: opening
    detect: heading
    aliases: [场景开场, 开场]
    required: true
    max_lines: 10
  - id: body
    detect: h3_range
    min: 4
    max: 6
    required: true
  - id: summary
    detect: heading
    aliases: [本章小结, 小结]
    required: true
  - id: exercise
    detect: heading
    aliases: [动手练习, 练习]
    required: true
    count_range: [2, 4]
  - id: checklist
    detect: heading
    aliases: [自查清单, 自查]
    required: true
    max_items: 10
  - id: pitfalls
    detect: heading
    aliases: [常见坑, 常见问题]
    required: true
    count_range: [3, 5]
  - id: next
    detect: heading
    aliases: [下一章]
    required: true

defaults:
  words_per_chapter: [5000, 7000]
  sections_per_chapter: [4, 6]
  words_per_section: [900, 1500]
  figures_min: 2          # 含章首导图
  tables_min: 1
  code_blocks_per_section_min: 1   # 有操作内容的节
  code_block_max_lines: 30
  info_density_min: 1.2    # 每千字可操作单元数，见 SPEC 16.1
  difficulty_curve: ramp   # ramp | flat | wave

# 文风指纹初值，第一波后校准
fingerprint:
  avg_sentence_len:     { mean: 26, band: 8 }      # 汉字/句
  avg_paragraph_len:    { mean: 80, band: 30 }     # 汉字/段
  annotation_per_kchar: { mean: 1.2, band: 0.5 }   # 每千字标注数
  figures_per_section:  { mean: 0.9, band: 0.4 }
  code_block_lines:     { mean: 18, band: 8 }
  person_ratio:         { 你: 0.60, 我们: 0.30, 其他: 0.10 }

# 领域断言词，与 _core.yaml 的通用表取并集
assertion_words: [准确率, 召回率, 延迟, 吞吐, 成本, 命中率]

anti_patterns:
  - 讲完原理不落步骤
  - 步骤不可执行
  - 示例数据不可得
  - 只给最终代码不给演进过程
  - 版本无关地讲 API
  - 一次讲三个方案却不给选择依据

# 章纲必须有的 front-matter 字段
plan_required_fields: [chapter, title, requires, references, target_words, difficulty, deliverable]
