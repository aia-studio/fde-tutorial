<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="30" font-size="15" fill="#0C447C" text-anchor="middle">一条差评走到回归集：五步，缺一步就白收</text>
  <rect x="25" y="62" width="118" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="84" y="88" font-size="13" fill="#0C447C" text-anchor="middle">收集</text>
  <text x="84" y="108" font-size="11" fill="#3C4C5C" text-anchor="middle">客服差评导出</text>
  <text x="84" y="124" font-size="11" fill="#3C4C5C" text-anchor="middle">带会话号</text>
  <rect x="158" y="62" width="118" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="217" y="88" font-size="13" fill="#0C447C" text-anchor="middle">去重</text>
  <text x="217" y="108" font-size="11" fill="#3C4C5C" text-anchor="middle">归一化问句</text>
  <text x="217" y="124" font-size="11" fill="#3C4C5C" text-anchor="middle">留最早一条</text>
  <rect x="291" y="62" width="118" height="70" rx="6" fill="#FDF3E7" stroke="#B57A2A" stroke-width="0.8"/>
  <text x="350" y="88" font-size="13" fill="#7A4A12" text-anchor="middle">判定</text>
  <text x="350" y="108" font-size="11" fill="#7A4A12" text-anchor="middle">复跑现网链路</text>
  <text x="350" y="124" font-size="11" fill="#7A4A12" text-anchor="middle">按结果分类</text>
  <rect x="424" y="62" width="118" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="483" y="88" font-size="13" fill="#0C447C" text-anchor="middle">分派</text>
  <text x="483" y="108" font-size="11" fill="#3C4C5C" text-anchor="middle">按类型给动作</text>
  <text x="483" y="124" font-size="11" fill="#3C4C5C" text-anchor="middle">写清负责人</text>
  <rect x="557" y="62" width="98" height="70" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="606" y="88" font-size="13" fill="#245024" text-anchor="middle">回归</text>
  <text x="606" y="108" font-size="11" fill="#2C4C2C" text-anchor="middle">进固定集</text>
  <text x="606" y="124" font-size="11" fill="#2C4C2C" text-anchor="middle">跑通才关单</text>
  <line x1="143" y1="97" x2="154" y2="97" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#m)"/>
  <line x1="276" y1="97" x2="287" y2="97" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#m)"/>
  <line x1="409" y1="97" x2="420" y2="97" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#m)"/>
  <line x1="542" y1="97" x2="553" y2="97" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#m)"/>
  <text x="340" y="176" font-size="12" fill="#5B6B7B" text-anchor="middle">判定的口径是复跑结果，不是客服的转述：同一个问题，系统这次落在哪条工单</text>
  <text x="340" y="202" font-size="12" fill="#5B6B7B" text-anchor="middle">判定只有四种结局：误拒、漏召、引错、该拒未拒；对不上的归人工复核</text>
  <text x="340" y="228" font-size="12" fill="#5B6B7B" text-anchor="middle">进回归集之前先复核一遍期望答案，错的标准会把后面每次改动都判成退化</text>
  <text x="340" y="262" font-size="12" fill="#5B6B7B" text-anchor="middle">一个月后回看：这一类问题下个月是不是还占同样的位置</text>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7B"/></marker></defs>
</svg>
