  <text x="604" y="106" font-size="10" fill="#3B7A3B" text-anchor="middle">送给生成</text>
  <line x1="133" y1="92" x2="149" y2="92" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="265" y1="92" x2="281" y2="92" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
