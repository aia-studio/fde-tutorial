<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="26" font-size="13" fill="#6B6252" text-anchor="middle">三个指标互相挤压，报一个数就隐掉另外两个</text>
  <line x1="340" y1="90" x2="174" y2="190" stroke="#6B6252" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="90" x2="506" y2="190" stroke="#6B6252" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="242" y1="214" x2="438" y2="214" stroke="#6B6252" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="270" y="44" width="140" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="64" font-size="11" fill="#0C447C" text-anchor="middle">召回</text>
  <text x="340" y="80" font-size="10" fill="#185FA5" text-anchor="middle">该找的找到了吗</text>
  <rect x="100" y="192" width="142" height="46" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="171" y="212" font-size="11" fill="#245024" text-anchor="middle">精确</text>
  <text x="171" y="228" font-size="10" fill="#3B7A3B" text-anchor="middle">找到的有多少能用</text>
  <rect x="438" y="192" width="142" height="46" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="509" y="212" font-size="11" fill="#7A3E0A" text-anchor="middle">成本</text>
  <text x="509" y="228" font-size="10" fill="#A5611B" text-anchor="middle">延迟与调用开销</text>
  <text x="152" y="138" font-size="10" fill="#6B6252" text-anchor="middle">想找全</text>
  <text x="152" y="154" font-size="10" fill="#6B6252" text-anchor="middle">就得容忍噪声</text>
  <text x="534" y="138" font-size="10" fill="#6B6252" text-anchor="middle">想更准</text>
  <text x="534" y="154" font-size="10" fill="#6B6252" text-anchor="middle">就多花钱与时间</text>
  <text x="340" y="248" font-size="10" fill="#6B6252" text-anchor="middle">想省钱，先砍候选</text>
  <text x="340" y="276" font-size="11" fill="#6B6252" text-anchor="middle">替代关系是结构性的：调参只能移动工作点，不能同时抬高三边</text>
</svg>
