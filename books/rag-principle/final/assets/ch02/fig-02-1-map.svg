<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210">
  <rect width="680" height="210" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="28" font-size="13" fill="#6B6252" text-anchor="middle">检索内部的分工：相似度负责排序，相关性负责判断</text>
  <rect x="20" y="64" width="120" height="58" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="80" y="88" font-size="12" fill="#245024" text-anchor="middle">问题</text>
  <text x="80" y="107" font-size="10" fill="#3B7A3B" text-anchor="middle">用户措辞</text>
  <rect x="172" y="64" width="120" height="58" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="232" y="88" font-size="12" fill="#0C447C" text-anchor="middle">编码</text>
  <text x="232" y="107" font-size="10" fill="#185FA5" text-anchor="middle">有损压缩</text>
  <rect x="324" y="64" width="140" height="58" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="394" y="88" font-size="12" fill="#0C447C" text-anchor="middle">相似度排序</text>
  <text x="394" y="107" font-size="10" fill="#185FA5" text-anchor="middle">只看距离</text>
  <rect x="496" y="64" width="164" height="58" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="578" y="88" font-size="12" fill="#7A3E0A" text-anchor="middle">候选集</text>
  <text x="578" y="107" font-size="10" fill="#A5611B" text-anchor="middle">相关性另判</text>
  <line x1="140" y1="93" x2="168" y2="93" stroke="#6B6252" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="292" y1="93" x2="320" y2="93" stroke="#6B6252" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="464" y1="93" x2="492" y2="93" stroke="#6B6252" stroke-width="1.2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <text x="340" y="158" font-size="11" fill="#6B6252" text-anchor="middle">排序手段与验收目标是两件事：分数高的块，未必回答了问题</text>
  <text x="340" y="182" font-size="11" fill="#A5611B" text-anchor="middle">相似度分数跨查询不可比，不能拿来当通过阈值</text>
