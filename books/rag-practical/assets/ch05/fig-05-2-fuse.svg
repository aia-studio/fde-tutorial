<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="30" font-size="15" fill="#0C447C" text-anchor="middle">两路候选按名次融合，再重排一次</text>
  <rect x="30" y="55" width="140" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="100" y="78" font-size="13" fill="#0C447C" text-anchor="middle">向量一路</text>
  <text x="100" y="96" font-size="11" fill="#3C4C5C" text-anchor="middle">余弦分，取前 20</text>
  <rect x="30" y="135" width="140" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="100" y="158" font-size="13" fill="#0C447C" text-anchor="middle">字面一路</text>
  <text x="100" y="176" font-size="11" fill="#3C4C5C" text-anchor="middle">BM25 分，取前 20</text>
  <rect x="215" y="90" width="150" height="65" rx="6" fill="#FDF3E7" stroke="#B57A2A" stroke-width="0.8"/>
  <text x="290" y="115" font-size="13" fill="#7A4A12" text-anchor="middle">RRF 融合</text>
  <text x="290" y="136" font-size="11" fill="#7A4A12" text-anchor="middle">按名次累加，不看分</text>
  <rect x="405" y="90" width="150" height="65" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="480" y="115" font-size="13" fill="#0C447C" text-anchor="middle">按工单去重</text>
  <text x="480" y="136" font-size="11" fill="#3C4C5C" text-anchor="middle">同号只留名次最高的块</text>
  <rect x="585" y="90" width="70" height="65" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="620" y="115" font-size="13" fill="#245024" text-anchor="middle">重排</text>
  <text x="620" y="136" font-size="11" fill="#2C4C2C" text-anchor="middle">覆盖率打分</text>
  <line x1="170" y1="81" x2="211" y2="105" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="170" y1="161" x2="211" y2="140" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="365" y1="122" x2="401" y2="122" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="555" y1="122" x2="581" y2="122" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#e)"/>
  <text x="340" y="225" font-size="12" fill="#5B6B7B" text-anchor="middle">融合解决「另一路有、这一路没有」，重排解决「都在候选里、顺序不对」</text>
  <text x="340" y="252" font-size="12" fill="#5B6B7B" text-anchor="middle">两件事的收益要分开量：前者看前五名命中，后者看第一名命中</text>
  <defs><marker id="e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7B"/></marker></defs>
</svg>
