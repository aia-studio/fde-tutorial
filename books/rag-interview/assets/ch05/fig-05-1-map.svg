<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <rect width="680" height="340" rx="8" fill="#F6F7F9" stroke="#CBD3DC" stroke-width="0.8"/>
  <rect x="250" y="14" width="180" height="38" rx="6" fill="#FBEAEA" stroke="#A63D3D" stroke-width="1.1"/>
  <text x="340" y="38" font-size="12" fill="#7C2B2B" text-anchor="middle">答案不对，先别改提示词</text>

  <line x1="340" y1="52" x2="340" y2="72" stroke="#7A8794" stroke-width="1.1"/>
  <rect x="180" y="72" width="320" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
  <text x="340" y="90" font-size="12" fill="#0C447C" text-anchor="middle">正确证据在候选集里吗</text>
  <text x="340" y="105" font-size="10" fill="#185FA5" text-anchor="middle">看的是检索结果，不是最终答案</text>

  <line x1="240" y1="112" x2="120" y2="146" stroke="#7A8794" stroke-width="1.1"/>
  <line x1="440" y1="112" x2="560" y2="146" stroke="#7A8794" stroke-width="1.1"/>
  <text x="164" y="136" font-size="10" fill="#5B6875" text-anchor="middle">不在</text>
  <text x="516" y="136" font-size="10" fill="#5B6875" text-anchor="middle">在</text>

  <rect x="16" y="146" width="210" height="62" rx="6" fill="#FDF3E7" stroke="#B97A2A" stroke-width="0.9"/>
  <text x="121" y="166" font-size="12" fill="#7A4A12" text-anchor="middle">检索缺失</text>
  <text x="121" y="184" font-size="10" fill="#7A4A12" text-anchor="middle">责任在切分与召回</text>
  <text x="121" y="200" font-size="10" fill="#B97A2A" text-anchor="middle">回 Ch02、Ch03 定位</text>

  <rect x="450" y="146" width="214" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
  <text x="557" y="171" font-size="12" fill="#0C447C" text-anchor="middle">模型超出证据说话了吗</text>

  <line x1="510" y1="186" x2="380" y2="218" stroke="#7A8794" stroke-width="1.1"/>
  <line x1="600" y1="186" x2="640" y2="218" stroke="#7A8794" stroke-width="1.1"/>
  <text x="426" y="208" font-size="10" fill="#5B6875" text-anchor="middle">是</text>
  <text x="632" y="208" font-size="10" fill="#5B6875" text-anchor="middle">否</text>

  <rect x="280" y="218" width="196" height="62" rx="6" fill="#FBEAEA" stroke="#A63D3D" stroke-width="0.9"/>
  <text x="378" y="238" font-size="12" fill="#7C2B2B" text-anchor="middle">生成越界</text>
  <text x="378" y="256" font-size="10" fill="#7C2B2B" text-anchor="middle">约束表达，补拒答策略</text>
  <text x="378" y="272" font-size="10" fill="#A63D3D" text-anchor="middle">对照：把证据直喂模型</text>

  <rect x="496" y="218" width="168" height="62" rx="6" fill="#EDEBF7" stroke="#5B4B9E" stroke-width="0.9"/>
  <text x="580" y="238" font-size="12" fill="#3D326E" text-anchor="middle">答案本身有争议</text>
  <text x="580" y="256" font-size="10" fill="#3D326E" text-anchor="middle">查问题歧义与标注</text>
  <text x="580" y="272" font-size="10" fill="#5B4B9E" text-anchor="middle">不是模型的责任</text>

  <rect x="16" y="222" width="210" height="58" rx="6" fill="#EAF3EC" stroke="#2E6B4F" stroke-width="0.9"/>
  <text x="121" y="242" font-size="11" fill="#1F4D38" text-anchor="middle">库里本来就没有答案</text>
  <text x="121" y="260" font-size="10" fill="#2E6B4F" text-anchor="middle">所以它只能编，该拒没拒</text>

  <text x="340" y="312" font-size="11" fill="#5B6875" text-anchor="middle">四类错误，四种责任方。混成一类叫幻觉，就只剩「调提示词」一条路</text>
</svg>
