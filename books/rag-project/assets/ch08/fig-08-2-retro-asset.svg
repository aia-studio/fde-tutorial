<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="Source Han Sans SC, Noto Sans SC, sans-serif">
  <rect width="680" height="200" rx="8" fill="#F7F4EF" stroke="#D9CFC0" stroke-width="0.8"/>
  <text x="340" y="26" font-size="13" fill="#6B5B45" text-anchor="middle">复盘条目沉淀成下次能用的东西</text>
  <text x="30" y="50" font-size="10" fill="#6B5B45">现象</text>
  <text x="250" y="50" font-size="10" fill="#6B5B45">判断</text>
  <text x="470" y="50" font-size="10" fill="#6B5B45">留下的资产</text>
  <rect x="30" y="60" width="180" height="32" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="81" font-size="11" fill="#0C447C" text-anchor="middle">第三档 P95 越线</text>
  <line x1="213" y1="76" x2="246" y2="76" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M250 76 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="254" y="60" width="170" height="32" rx="5" fill="#F7F4EF" stroke="#B9A88F" stroke-width="1"/>
  <text x="339" y="81" font-size="11" fill="#6B5B45" text-anchor="middle">容量估算偏乐观</text>
  <line x1="427" y1="76" x2="460" y2="76" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M464 76 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="468" y="60" width="182" height="32" rx="5" fill="#185FA5" stroke="#0C447C" stroke-width="1"/>
  <text x="559" y="81" font-size="11" fill="#FFFFFF" text-anchor="middle">压测条件写进报告模板</text>
  <rect x="30" y="104" width="180" height="32" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="125" font-size="11" fill="#0C447C" text-anchor="middle">映射漏客户全称</text>
  <line x1="213" y1="120" x2="246" y2="120" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M250 120 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="254" y="104" width="170" height="32" rx="5" fill="#F7F4EF" stroke="#B9A88F" stroke-width="1"/>
  <text x="339" y="125" font-size="11" fill="#6B5B45" text-anchor="middle">评审只对字段名不够</text>
  <line x1="427" y1="120" x2="460" y2="120" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M464 120 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="468" y="104" width="182" height="32" rx="5" fill="#185FA5" stroke="#0C447C" stroke-width="1"/>
  <text x="559" y="125" font-size="11" fill="#FFFFFF" text-anchor="middle">字段含义逐条念一遍</text>
  <rect x="30" y="148" width="180" height="32" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="169" font-size="11" fill="#0C447C" text-anchor="middle">坐席点了三次没找到</text>
  <line x1="213" y1="164" x2="246" y2="164" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M250 164 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="254" y="148" width="170" height="32" rx="5" fill="#F7F4EF" stroke="#B9A88F" stroke-width="1"/>
  <text x="339" y="169" font-size="11" fill="#6B5B45" text-anchor="middle">块内没有句子定位</text>
  <line x1="427" y1="164" x2="460" y2="164" stroke="#8A8A8A" stroke-width="1"/>
  <path d="M464 164 l-6 -3 v6 z" fill="#8A8A8A"/>
  <rect x="468" y="148" width="182" height="32" rx="5" fill="#185FA5" stroke="#0C447C" stroke-width="1"/>
  <text x="559" y="169" font-size="11" fill="#FFFFFF" text-anchor="middle">切分留句子边界</text>
  <text x="30" y="190" font-size="10" fill="#8A8A8A">只写现象不写判断，下次还会重新踩；资产要能被下一个人直接拿去用。</text>
</svg>
