<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect width="680" height="300" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="30" font-size="15" fill="#0C447C" text-anchor="middle">一轮的完整顺序：先读状态、再改写、再检索，答完写回</text>
  <rect x="30" y="60" width="140" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="100" y="84" font-size="13" fill="#0C447C" text-anchor="middle">用户问句</text>
  <text x="100" y="104" font-size="11" fill="#3C4C5C" text-anchor="middle">常是半句</text>
  <rect x="200" y="60" width="150" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="275" y="84" font-size="13" fill="#0C447C" text-anchor="middle">读会话状态</text>
  <text x="275" y="104" font-size="11" fill="#3C4C5C" text-anchor="middle">产品 + 上一轮工单号</text>
  <rect x="380" y="60" width="140" height="60" rx="6" fill="#FDF3E7" stroke="#B57A2A" stroke-width="0.8"/>
  <text x="450" y="84" font-size="13" fill="#7A4A12" text-anchor="middle">改写</text>
  <text x="450" y="104" font-size="11" fill="#7A4A12" text-anchor="middle">只补缺失的槽位</text>
  <rect x="550" y="60" width="100" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="600" y="84" font-size="13" fill="#0C447C" text-anchor="middle">检索重排</text>
  <text x="600" y="104" font-size="11" fill="#3C4C5C" text-anchor="middle">取前五</text>
  <rect x="550" y="170" width="100" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="600" y="194" font-size="13" fill="#0C447C" text-anchor="middle">判定</text>
  <text x="600" y="214" font-size="11" fill="#3C4C5C" text-anchor="middle">答或拒</text>
  <rect x="380" y="170" width="140" height="60" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="450" y="194" font-size="13" fill="#245024" text-anchor="middle">写回状态</text>
  <text x="450" y="214" font-size="11" fill="#2C4C2C" text-anchor="middle">覆盖最旧的一轮</text>
  <rect x="200" y="170" width="150" height="60" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="275" y="194" font-size="13" fill="#245024" text-anchor="middle">三轮后淘汰</text>
  <text x="275" y="214" font-size="11" fill="#2C4C2C" text-anchor="middle">上限写死，不随会话涨</text>
  <rect x="30" y="170" width="140" height="60" rx="6" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="100" y="194" font-size="12" fill="#5B6B7B" text-anchor="middle">下一轮从</text>
  <text x="100" y="214" font-size="12" fill="#5B6B7B" text-anchor="middle">「读状态」再来</text>
  <line x1="170" y1="90" x2="196" y2="90" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="350" y1="90" x2="376" y2="90" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="520" y1="90" x2="546" y2="90" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="600" y1="120" x2="600" y2="166" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="550" y1="200" x2="524" y2="200" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="380" y1="200" x2="354" y2="200" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="200" y1="200" x2="174" y2="200" stroke="#5B6B7B" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M100,170 L100,128 L200,128 L200,124" fill="none" stroke="#5B6B7B" stroke-width="1.2"
        stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="340" y="262" font-size="12" fill="#5B6B7B" text-anchor="middle">状态在改写之前读，在回答之后写；写的是实体，不是这一段对话的全文</text>
  <text x="340" y="286" font-size="12" fill="#5B6B7B" text-anchor="middle">拒答的那一轮也要写回：没有工单号，但产品仍然算数</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7B"/></marker></defs>
</svg>
