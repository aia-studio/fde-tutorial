<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Source Han Sans SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/>
    </marker>
    <marker id="a5r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="680" height="340" rx="8" fill="#F7F4EF" stroke="#D9CFC0" stroke-width="0.8"/>
  <text x="340" y="26" font-size="13" fill="#6B5B45" text-anchor="middle">联调先对齐时序：会话先开，问题后到，答案带 trace</text>

  <rect x="40" y="44" width="120" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="100" y="62" font-size="11" fill="#0C447C" text-anchor="middle">客服系统</text>
  <rect x="280" y="44" width="120" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="62" font-size="11" fill="#0C447C" text-anchor="middle">问答服务</text>
  <rect x="530" y="44" width="120" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="590" y="62" font-size="11" fill="#0C447C" text-anchor="middle">检索 / 模型</text>

  <line x1="100" y1="70" x2="100" y2="300" stroke="#C9BDA9" stroke-width="0.9" stroke-dasharray="4 4"/>
  <line x1="340" y1="70" x2="340" y2="300" stroke="#C9BDA9" stroke-width="0.9" stroke-dasharray="4 4"/>
  <line x1="590" y1="70" x2="590" y2="300" stroke="#C9BDA9" stroke-width="0.9" stroke-dasharray="4 4"/>

  <line x1="100" y1="92" x2="334" y2="92" stroke="#185FA5" stroke-width="1.4" marker-end="url(#a5)"/>
  <text x="217" y="86" font-size="10" fill="#0C447C" text-anchor="middle">1 session.open（坐席 + 租户）</text>

  <line x1="340" y1="126" x2="106" y2="126" stroke="#185FA5" stroke-width="1.4" marker-end="url(#a5)"/>
  <text x="223" y="120" font-size="10" fill="#0C447C" text-anchor="middle">2 session.opened（会话号）</text>

  <line x1="100" y1="160" x2="334" y2="160" stroke="#185FA5" stroke-width="1.4" marker-end="url(#a5)"/>
  <text x="217" y="154" font-size="10" fill="#0C447C" text-anchor="middle">3 question（问题原文 + 工单号）</text>

  <line x1="340" y1="194" x2="584" y2="194" stroke="#185FA5" stroke-width="1.4" marker-end="url(#a5)"/>
  <text x="462" y="188" font-size="10" fill="#0C447C" text-anchor="middle">4 取候选，记 trace_id</text>

  <line x1="590" y1="228" x2="346" y2="228" stroke="#B45309" stroke-width="1.4" marker-end="url(#a5r)"/>
  <text x="468" y="222" font-size="10" fill="#8A3D06" text-anchor="middle">5 只回候选片段，不回全库</text>

  <line x1="340" y1="262" x2="106" y2="262" stroke="#185FA5" stroke-width="1.4" marker-end="url(#a5)"/>
  <text x="223" y="256" font-size="10" fill="#0C447C" text-anchor="middle">6 answer + citations + trace_id</text>

  <text x="340" y="286" font-size="10" fill="#8A7C68" text-anchor="middle">同一 session 重复提问命中缓存，检索只调一次</text>
  <text x="340" y="322" font-size="11" fill="#4A4137" text-anchor="middle">字段对齐写在接口文档里，顺序对齐写在时序图里，两样都要双方签字</text>
</svg>
