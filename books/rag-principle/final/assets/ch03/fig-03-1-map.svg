  <text x="472" y="106" font-size="10" fill="#185FA5" text-anchor="middle">召回候选</text>
  <rect x="549" y="64" width="110" height="56" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
