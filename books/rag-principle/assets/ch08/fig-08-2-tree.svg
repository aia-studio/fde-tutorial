<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352">
  <rect width="680" height="352" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="26" font-size="13" fill="#6B6252" text-anchor="middle">选择树：先问答案的形态，再问证据的性质</text>
  <rect x="190" y="44" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="295" y="71" font-size="11" fill="#3A3428" text-anchor="middle">答案是算出来的唯一值吗</text>
  <rect x="190" y="118" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="295" y="145" font-size="11" fill="#3A3428" text-anchor="middle">证据要可追溯、会变吗</text>
  <rect x="190" y="192" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="295" y="219" font-size="11" fill="#3A3428" text-anchor="middle">要改的是格式与语气吗</text>
  <rect x="470" y="44" width="180" height="44" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="560" y="64" font-size="11" fill="#7A3E0A" text-anchor="middle">查询接口</text>
  <text x="560" y="80" font-size="10" fill="#A5611B" text-anchor="middle">让系统去算，不要让模型去猜</text>
  <rect x="470" y="118" width="180" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="560" y="138" font-size="11" fill="#0C447C" text-anchor="middle">检索</text>
  <text x="560" y="154" font-size="10" fill="#185FA5" text-anchor="middle">证据在外、要出处、要能换</text>
  <rect x="470" y="192" width="180" height="44" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="560" y="212" font-size="11" fill="#245024" text-anchor="middle">微调</text>
  <text x="560" y="228" font-size="10" fill="#3B7A3B" text-anchor="middle">事实稳定，改的是输出习惯</text>
  <rect x="470" y="266" width="180" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="560" y="286" font-size="11" fill="#0C447C" text-anchor="middle">长上下文</text>
  <text x="560" y="302" font-size="10" fill="#185FA5" text-anchor="middle">语料小、稳定、问题不挑剔</text>
  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <line x1="402" y1="66" x2="466" y2="66" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="402" y1="140" x2="466" y2="140" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="402" y1="214" x2="466" y2="214" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="295" y1="90" x2="295" y2="114" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <line x1="295" y1="164" x2="295" y2="188" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <polyline points="295,238 295,288 466,288" fill="none" stroke="#6B6252" stroke-width="1.2" marker-end="url(#d)"/>
  <text x="412" y="60" font-size="10" fill="#3B7A3B">是</text>
  <text x="412" y="134" font-size="10" fill="#3B7A3B">是</text>
  <text x="412" y="208" font-size="10" fill="#3B7A3B">是</text>
  <text x="306" y="106" font-size="10" fill="#A33A3A">否</text>
  <text x="306" y="180" font-size="10" fill="#A33A3A">否</text>
  <text x="306" y="262" font-size="10" fill="#A33A3A">否</text>
  <text x="340" y="336" font-size="11" fill="#6B6252" text-anchor="middle">四条都走不通时，先补语料或明确拒答，不要靠调参把前提补上</text>
</svg>
