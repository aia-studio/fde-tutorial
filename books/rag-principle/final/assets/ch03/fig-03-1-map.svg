  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <text x="340" y="154" font-size="11" fill="#6B6252" text-anchor="middle">切分决定三件事：块多大、切点在哪、块与块是否重叠</text>
  <text x="340" y="178" font-size="11" fill="#A5611B" text-anchor="middle">改一次切分，要重建整个索引：这是检索链路里最贵的一次修改</text>
