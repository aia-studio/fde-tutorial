<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230">
  <rect width="680" height="230" rx="8" fill="#F7F5F0" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="340" y="28" font-size="13" fill="#6B6252" text-anchor="middle">排名链路：先归一，再融合，最后重排</text>
  <rect x="30" y="54" width="150" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="105" y="72" font-size="11" fill="#0C447C" text-anchor="middle">稠密一路</text>
  <text x="105" y="88" font-size="10" fill="#185FA5" text-anchor="middle">向量距离</text>
  <rect x="30" y="114" width="150" height="44" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="105" y="132" font-size="11" fill="#245024" text-anchor="middle">稀疏一路</text>
  <text x="105" y="148" font-size="10" fill="#3B7A3B" text-anchor="middle">词项加权</text>
  <rect x="216" y="84" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="0.8"/>
  <text x="276" y="102" font-size="11" fill="#3A3428" text-anchor="middle">转成排名</text>
  <text x="276" y="118" font-size="10" fill="#6B6252" text-anchor="middle">丢掉分数间距</text>
  <rect x="372" y="84" width="110" height="44" rx="6" fill="#FBEFE6" stroke="#A5611B" stroke-width="0.8"/>
  <text x="427" y="102" font-size="11" fill="#7A3E0A" text-anchor="middle">融合</text>
  <text x="427" y="118" font-size="10" fill="#A5611B" text-anchor="middle">按位次加权</text>
  <rect x="518" y="84" width="120" height="44" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="578" y="102" font-size="11" fill="#245024" text-anchor="middle">重排</text>
  <text x="578" y="118" font-size="10" fill="#3B7A3B" text-anchor="middle">逐条重估</text>
  <line x1="180" y1="76" x2="212" y2="96" stroke="#6B6252" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="180" y1="136" x2="212" y2="116" stroke="#6B6252" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="336" y1="106" x2="368" y2="106" stroke="#6B6252" stroke-width="1.2" marker-end="url(#e)"/>
  <line x1="482" y1="106" x2="514" y2="106" stroke="#6B6252" stroke-width="1.2" marker-end="url(#e)"/>
  <defs><marker id="e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B6252"/></marker></defs>
  <text x="340" y="190" font-size="11" fill="#6B6252" text-anchor="middle">分数不可比时，能比的只有排名；融合不创造候选</text>
  <text x="340" y="212" font-size="11" fill="#A5611B" text-anchor="middle">重排只在候选池里已有正确答案时带来增量</text>
</svg>
