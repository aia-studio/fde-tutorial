<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <rect width="680" height="340" rx="8" fill="#F4F7FB" stroke="#C9D6E4" stroke-width="0.8"/>
  <text x="340" y="34" font-size="16" fill="#0C447C" text-anchor="middle">Ch03 接上向量检索：从块到候选</text>
  <rect x="40" y="60" width="280" height="105" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="60" y="86" font-size="14" fill="#0C447C">3.1 Top-K 与相似度</text>
  <text x="60" y="110" font-size="12" fill="#3C4C5C">余弦分数只在同一批查询里可比</text>
  <text x="60" y="132" font-size="12" fill="#3C4C5C">K 太小漏答案，太大塞噪声</text>
  <text x="60" y="154" font-size="12" fill="#3C4C5C">先固定 K=5，再谈调</text>
  <rect x="360" y="60" width="280" height="105" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="380" y="86" font-size="14" fill="#0C447C">3.2 元数据过滤</text>
  <text x="380" y="110" font-size="12" fill="#3C4C5C">先过滤再排序，缩小误召范围</text>
  <text x="380" y="132" font-size="12" fill="#3C4C5C">过滤条件写成 SQL，不写进循环</text>
  <text x="380" y="154" font-size="12" fill="#3C4C5C">代价：条件写错会整片剪掉答案</text>
  <rect x="40" y="190" width="280" height="105" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="60" y="216" font-size="14" fill="#0C447C">3.3 10 条召回样本</text>
  <text x="60" y="240" font-size="12" fill="#3C4C5C">每条查询挂一个 gold 工单号</text>
  <text x="60" y="262" font-size="12" fill="#3C4C5C">看 recall@1/3/5，不只看 Top-1</text>
  <text x="60" y="284" font-size="12" fill="#3C4C5C">样本要覆盖三类难查询</text>
  <rect x="360" y="190" width="280" height="105" rx="6" fill="#EAF3EA" stroke="#3B7A3B" stroke-width="0.8"/>
  <text x="380" y="216" font-size="14" fill="#245024">3.4 常见召回失败</text>
  <text x="380" y="240" font-size="12" fill="#2C4C2C">专有名词、数字、短查询</text>
  <text x="380" y="262" font-size="12" fill="#2C4C2C">先判类，再决定改切分还是改检索</text>
  <text x="380" y="284" font-size="12" fill="#2C4C2C">产物：能返回 Top-K 的检索器</text>
  <text x="340" y="325" font-size="12" fill="#5B6B7B" text-anchor="middle">这一章只解决「找得到」，不解决「排得准」</text>
</svg>
